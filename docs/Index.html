<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUMA LINK | School Management</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172554;
}

header {
  background: #102a56;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  font-size: 12px;
  letter-spacing: 1px;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000012;
}

input, button {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border-radius: 7px;
  font-size: 15px;
}

input {
  border: 1px solid #cbd5e1;
}

button {
  border: none;
  background: #102a56;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #15803d;
}

.hidden {
  display: none;
}

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.tile {
  background: #e8eef8;
  padding: 20px 10px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

#message {
  color: #b91c1c;
  font-size: 14px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>MUMA LINK</h1>
  <p>PRECISION, INTELLIGENCE AND EXCELLENCE IN SCHOOL MANAGEMENT</p>
</header>

<div class="container">

  <div class="card" id="loginSection">
    <h2>Welcome to MUMA LINK</h2>
    <p>Sign in to access your school management dashboard.</p>

    <input type="email" id="email" placeholder="Email address">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Sign In</button>

    <button class="secondary" onclick="register()">
      Register Teacher Account
    </button>

    <p id="message"></p>
  </div>

  <div class="card hidden" id="dashboardSection">
    <h2>School Dashboard</h2>
    <p id="welcome"></p>

    <div class="dashboard">
      <div class="tile">Schools</div>
      <div class="tile">Headteachers</div>
      <div class="tile">Teachers</div>
      <div class="tile">Learners</div>
      <div class="tile">Classes</div>
      <div class="tile">Attendance</div>
      <div class="tile">Academic Performance</div>
      <div class="tile">Reports</div>
    </div>

    <button onclick="logout()">Sign Out</button>
  </div>

</div>
